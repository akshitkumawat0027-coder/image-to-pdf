    <!-- JavaScript Logic -->
    <script>
        const imageInput = document.getElementById('imageInput');
        const previewContainer = document.getElementById('previewContainer');
        const convertBtn = document.getElementById('convertBtn');
        let uploadedFiles = [];

        imageInput.addEventListener('change', (e) => {
            uploadedFiles = Array.from(e.target.files);
            previewContainer.innerHTML = '';
            
            if (uploadedFiles.length > 0) {
                convertBtn.classList.remove('hidden');
                uploadedFiles.forEach((file, index) => {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const div = document.createElement('div');
                        div.className = 'relative border rounded overflow-hidden h-24 bg-slate-100 flex items-center justify-center';
                        div.innerHTML = `<img src="${event.target.result}" class="object-cover h-full w-full">`;
                        previewContainer.appendChild(div);
                    }
                    reader.readAsDataURL(file);
                });
            } else {
                convertBtn.classList.add('hidden');
            }
        });

        async function convertToPDF() {
            if (uploadedFiles.length === 0) return;
            
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            for (let i = 0; i < uploadedFiles.length; i++) {
                const file = uploadedFiles[i];
                const base64Data = await toBase64(file);
                
                if (i > 0) doc.addPage();
                
                const imgProps = doc.getImageProperties(base64Data);
                const pdfWidth = doc.internal.pageSize.getWidth();
                const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
                
                doc.addImage(base64Data, 'JPEG', 0, 10, pdfWidth, pdfHeight);
            }

            doc.save("converted-images.pdf");
        }

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    </script>
